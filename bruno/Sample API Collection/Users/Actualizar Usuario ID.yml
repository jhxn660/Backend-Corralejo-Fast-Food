info:
  name: Actualizar Usuario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "role": "Empleado",
        "name": "Mateo",
        "email": "mateo{{$timestamp}}@correo.com",
        "state": true,
        "empleado_rol": "Mesero"
      }
      // La contraseña no se actualiza por esta ruta (el controlador la descarta)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
