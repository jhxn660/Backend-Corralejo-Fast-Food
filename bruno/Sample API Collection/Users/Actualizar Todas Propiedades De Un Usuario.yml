info:
  name: Actualizar Todas Propiedades De Un Usuario
  type: http
  seq: 5

http:
  method: PATCH
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: igual que Actualizar Usuario ID (PUT y PATCH hacen lo mismo).
      // Token: Owner o Administrador, o el propio usuario. Esperado 200.
      {
        "role": "Empleado",
        "name": "Mateo Chaves",
        "email": "mateo.chaves{{$timestamp}}@correo.com",
        "status": true,
        "empleado_rol": "Cocinero"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
