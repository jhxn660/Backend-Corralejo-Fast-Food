info:
  name: Actualizar Insumo ID
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:3000/api/supplies/{{supplyId}}
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Harina de trigo {{$timestamp}}",
        "description": "Harina de trigo para el pan",
        "medida": "10 KG",
        "cost": 30000,
        "stock": 3,
        "state": "Con_Stock"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
