info:
  name: Crear Categoria
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/categories
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // "type": "Producto" o "Insumo" (Productos e Insumos exigen el tipo que les corresponde).
      // createdBy lo asigna el servidor con el usuario del token.
      // Esperado 201; guarda {{categoryId}}. Con otro rol → 403; sin token o vencido → 401.
      // Variante: "type": "Otro" → 400.
      {
        "name": "Hamburguesas {{$timestamp}}",
        "type": "Producto",
        "description": "deliciosas hamburguesas para tu paladar"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("categoryId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
