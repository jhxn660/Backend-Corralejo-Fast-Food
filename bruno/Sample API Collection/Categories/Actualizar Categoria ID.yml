info:
  name: Actualizar Categoria ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/categories/{{categoryId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Hamburguesas Gourmet {{$timestamp}}",
        "description": "Hamburguesas artesanales de la casa",
        "status": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
