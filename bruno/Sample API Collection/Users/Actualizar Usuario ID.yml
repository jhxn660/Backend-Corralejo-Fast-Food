info:
  name: Actualizar Usuario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{userId}} (Registrar Usuario). Token: Owner o Administrador, o el propio usuario.
      // La password no se cambia por aquí. Si no eres Owner/Administrador, "role" se ignora.
      // Solo un Owner edita o asciende a un Owner. Esperado 200. Otro usuario sin rol de administración → 403. ID inexistente → 404; ID mal formado → 400.
      {
        "role": "Empleado",
        "name": "Mateo",
        "email": "mateo{{$timestamp}}@correo.com",
        "status": true,
        "empleado_rol": "Mesero"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
