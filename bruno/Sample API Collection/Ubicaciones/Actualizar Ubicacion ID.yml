info:
  name: Actualizar Ubicacion ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/ubicaciones/{{ubicacionId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
          "titulo": "Sede Principal Corralejo",
          "telefono": "3158889999",
          "referencia": "Al lado del centro comercial, local 102"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
