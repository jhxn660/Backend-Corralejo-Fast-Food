info:
  name: Actualizar Cierre ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/cierres/{{cierreId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{cierreId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // Envía solo los campos a cambiar (horas en HH:MM, 24 h). Esperado 200; hora inválida → 400. ID inexistente → 404; ID mal formado → 400.
      {
          "estaAbierto": true,
          "horaApertura": "10:00",
          "horaCierre": "14:00",
          "motivo": "Horario reducido por festivo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
