info:
  name: Crear Categoria
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/categories
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Hamburguesas {{$timestamp}}",
        "type": "Producto",
        "description": "deliciosas hamburguesas para tu paladar"
      }
      // "createdBy" ya no se envia: se asigna automaticamente con el usuario del token.
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("categoryId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
