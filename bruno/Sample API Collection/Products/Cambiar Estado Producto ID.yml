info:
  name: Cambiar Estado Producto ID
  type: http
  seq: 6

http:
  method: PATCH
  url: "http://localhost:3000/api/products/{{productId}}/status"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{productId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // false lo oculta de Listar Productos Publicos; true lo vuelve a mostrar. Es la única vía para cambiar isActive.
      // Esperado 200. "isActive" que no sea booleano → 400.
      { "isActive": false }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
