info:
  name: Leer Todas Categorias
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/categories
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200 { data: [...] }. Con otro rol → 403; sin token o vencido → 401.
