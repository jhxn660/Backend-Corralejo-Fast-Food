info:
  name: Login Usuario
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/auth/login
  body:
    type: json
    data: |-
      // PRUEBA: ejecútalo PRIMERO. Guarda el token en {{token}} (dura 1 hora).
      // Usa la cuenta del rol que vas a probar: Owner, Administrador, Empleado o Cliente.
      // Esperado 200 { msg, token, data }.
      // Correo inexistente o clave incorrecta → 401 "Credenciales inválidas" (mismo mensaje a propósito).
      // Variante: "email": { "$ne": null } → 401 (se rechaza todo lo que no sea texto).
      {
        "email": "45547383w3@gmail.com",
        "password": "Hol@hoal12"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el token: todas las peticiones lo envían en la cabecera X-Token como {{token}}
        if (res.status === 200) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
