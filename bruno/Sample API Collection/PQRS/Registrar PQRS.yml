info:
  name: Registrar PQRS
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/pqrs
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "tipo": "Petición",
        "asunto": "Solicitud de información",
        "descripcion": "Quisiera consultar los horarios de atención del local."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("pqrsId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Solo el rol Cliente puede registrar PQRS.
