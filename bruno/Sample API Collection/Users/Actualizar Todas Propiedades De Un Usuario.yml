info:
  name: Actualizar Todas Propiedades De Un Usuario
  type: http
  seq: 5

http:
  method: PUT
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "role": "Empleado",
        "name": "Mateo Chaves",
        "email": "mateo.chaves{{$timestamp}}@correo.com",
        "state": true,
        "empleado_rol": "Cocinero"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
