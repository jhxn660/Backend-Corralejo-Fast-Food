info:
  name: Añadir Productos Pedido ID
  type: http
  seq: 6

http:
  method: POST
  url: "http://localhost:3000/api/orders/{{orderId}}/items"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{orderId}} (Crear Pedido) y {{productId}}. Token: Owner, Administrador o Empleado.
      // Paso 1: ejecuta Crear Pedido. Paso 2: ejecuta esta petición y compara con Obtener Pedido ID.
      // Producto que ya estaba: suma la cantidad a su línea y CONSERVA el precio con el que se pidió.
      // Producto nuevo: agrega una línea con el precio actual del catálogo. Subtotales y total se recalculan.
      // Esperado 200 con el pedido actualizado (mismo orderNumber).
      // 409 si el pedido está Entregado, Finalizado o Cancelado, o si otra caja lo
      // modificó al mismo tiempo (vuelve a intentarlo). 404 si el pedido no existe. Items inválidos → 400.
      {
        "items": [
          { "productId": "{{productId}}", "quantity": 1 }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
