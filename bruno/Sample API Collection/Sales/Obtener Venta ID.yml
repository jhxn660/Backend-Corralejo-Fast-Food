info:
  name: Obtener Venta ID
  type: http
  seq: 3

http:
  method: GET
  url: "http://localhost:3000/api/sales/{{saleDocId}}"
  headers:
    - name: X-Token
      value: "{{token}}"

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{saleDocId}}. Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200 con saleId, ticketId, qr y el pedido completo en orderId. ID inexistente → 404; ID mal formado → 400.
