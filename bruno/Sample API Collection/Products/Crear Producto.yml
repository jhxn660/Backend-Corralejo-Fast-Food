info:
  name: Crear Producto
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/products
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{categoryId}} de una categoría "type": "Producto" (Categories/Crear Categoria). Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // "name" es único y de al menos 5 caracteres. createdBy lo asigna el servidor. Nace visible (status: true).
      // Esperado 201; guarda {{productId}}. Nombre repetido → 400. Con otro rol → 403; sin token o vencido → 401.
      {
        "name": "Hamburguesa de res {{$timestamp}}",
        "description": "Deliciosa hamburguesa de carne de res para tu paladar",
        "price": 18000,
        "stock": 138,
        "images": [{ "url": "/uploads/hamburguesa-de-res.jpg", "isMain": true }],
        "category": "{{categoryId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("productId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
