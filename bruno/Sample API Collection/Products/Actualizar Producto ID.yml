info:
  name: Actualizar Producto ID
  type: http
  seq: 5

http:
  method: PATCH
  url: "http://localhost:3000/api/products/{{productId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{productId}} (Crear Producto). Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // Envía solo los campos a cambiar. status se ignora aquí (usa Cambiar Estado Producto ID).
      // Esperado 200. "price": -1 → 400. ID inexistente → 404; ID mal formado → 400.
      {
        "name": "Hamburguesa CFF {{$timestamp}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
