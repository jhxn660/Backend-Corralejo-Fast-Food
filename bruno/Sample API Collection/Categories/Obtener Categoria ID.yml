info:
  name: Obtener Categoria ID
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:3000/api/categories/{{categoryId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{categoryId}}. Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200. ID inexistente → 404; ID mal formado → 400.
