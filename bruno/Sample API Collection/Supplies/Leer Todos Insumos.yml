info:
  name: Leer Todos Insumos
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/supplies
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Filtro opcional ?status=Con_Stock|Sin_Stock. Esperado 200.
