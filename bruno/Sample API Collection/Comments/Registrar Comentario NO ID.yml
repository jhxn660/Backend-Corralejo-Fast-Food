info:
  name: Registrar Comentario NO ID
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/comments
  headers:
    - name: X-Token
      value: "{{token}}"
      disabled: true
  body:
    type: json
    data: |-
      // PRUEBA: antes ejecuta Orders/Crear Pedido y Sales/Registrar Venta (guarda el QR en {{saleQr}}).
      // "codigo" es lo que contiene el QR del ticket (campo "qr" de la venta).
      // Sin token comenta un visitante; activa la cabecera X-Token con un Cliente para quedar como autor
      // (Owner, Administrador o Empleado → 403). "calificacion" es opcional: entero de 1 a 5.
      // Esperado 201; guarda {{commentId}}.
      // Mismo QR otra vez → 400 (un comentario por ticket). Código inventado → 404. Sin "codigo" → 400.
      {
        "codigo": "{{saleQr}}",
        "comentario": "Excelente atención y la comida llegó calientita. Definitivamente vuelvo a pedir.",
        "calificacion": 5
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("commentId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
