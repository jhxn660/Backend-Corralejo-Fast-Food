info:
  name: Crear Producto
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/products
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "nombre": "Hamburguesa de res {{$timestamp}}",
        "description": "Deliciosa hamburguesa de carne de res para tu paladar",
        "price": 18000,
        "stock": 138,
        "state": "disponible",
        "category": "{{categoryId}}"
      }
      // "createdBy" ya no se envia: se asigna automaticamente con el usuario del token.
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("productId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  CAMBIO: las categorias solo se gestionan en la carpeta Categories. Antes de esta peticion ejecuta
  Categories > Crear Categoria con "type": "Producto"; guarda su _id en {{categoryId}}.
