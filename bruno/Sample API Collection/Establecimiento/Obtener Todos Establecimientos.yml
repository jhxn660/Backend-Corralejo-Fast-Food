info:
  name: Obtener Todos Establecimientos
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/establecimiento
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
