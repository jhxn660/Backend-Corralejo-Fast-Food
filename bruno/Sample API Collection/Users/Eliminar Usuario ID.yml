info:
  name: Eliminar Usuario ID
  type: http
  seq: 6

http:
  method: DELETE
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{userId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
  Solo un Owner elimina a un Owner. Esperado 200; repetir → 404.
