info:
  name: Actualizar Horario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/horarios/{{horarioId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
          "horaCierre": "11:00 PM"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
