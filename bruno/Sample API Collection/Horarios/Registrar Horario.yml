info:
  name: Registrar Horario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/horarios
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
          "dia": "Martes",
          "horaApertura": "08:00 AM",
          "horaCierre": "10:00 PM"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("horarioId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
