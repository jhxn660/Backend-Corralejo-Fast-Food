info:
  name: Actualizar Horario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/horarios/{{horarioId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{horarioId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // Envía solo los campos a cambiar. Esperado 200. ID inexistente → 404; ID mal formado → 400.
      {
          "horaCierre": "11:00 PM"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
