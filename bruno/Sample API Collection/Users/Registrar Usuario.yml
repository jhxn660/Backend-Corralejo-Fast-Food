info:
  name: Registrar Usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/users
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "role": "Administrador",
        "name": "Tom Gomez",
        "email": "tom{{$timestamp}}@correo.com",
        "password": "Tom@12345",
        "empleado_rol": "Cajero"
      }
      // createdBy no es necesario ponerlo manualmente
      // El sufijo $timestamp evita correos duplicados al repetir la prueba
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("userId", res.body.user._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
