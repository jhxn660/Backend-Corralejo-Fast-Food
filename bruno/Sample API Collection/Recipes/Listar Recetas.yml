info:
  name: Listar Recetas
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:3000/api/recipes"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (el Empleado solo lee). Cliente → 403.
  Esperado 200 con cada receta, su producto (name, price) y sus insumos (name, medida, stock).
