info:
  name: Registrar Contenido Establecimiento
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/establecimiento
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
          "titulo": "La Historia de Corralejo",
          "subtitulo": "Desde 2018",
          "contenido": "Corralejo Fast Food nació como un proyecto familiar apasionado por los sabores auténticos y la comida rápida de calidad.",
          "categoria": "El Origen"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("establecimientoId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
