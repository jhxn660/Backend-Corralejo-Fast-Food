info:
  name: Eliminar Cierre ID
  type: http
  seq: 5

http:
  method: DELETE
  url: "http://localhost:3000/api/cierres/{{cierreId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{cierreId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200 (la fecha vuelve a seguir el horario semanal); repetir → 404.
