info:
  name: Crear Insumo
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/supplies
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{categoryId}} de una categoría "type": "Insumo" (Categories/Crear Categoria). Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // createdBy lo asigna el servidor. "status" por defecto "Con_Stock".
      // Esperado 201; guarda {{supplyId}}. Categoría de tipo Producto → 400. Con otro rol → 403; sin token o vencido → 401.
      {
        "name": "Pan brioche {{$timestamp}}",
        "description": "Pan artesanal para hamburguesa",
        "medida": "Unidades",
        "cost": 1200,
        "stock": 300,
        "category": "{{categoryId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("supplyId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
