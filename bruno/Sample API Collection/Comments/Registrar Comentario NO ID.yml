info:
  name: Registrar Comentario NO ID
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/comments
  headers:
    - name: X-Token
      value: "{{token}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "codigo": "{{ticketVenta}}",
        "comentario": "Excelente atención y la comida llegó calientita. Definitivamente vuelvo a pedir."
      }

      // "codigo" simula la lectura del QR: es el idTicketVenta creado en Sales/Registrar Venta.
      // Sin token comenta un visitante ('Usuario'); activa la cabecera X-Token para comentar como 'Cliente'.
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("commentId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Requiere ejecutar antes Orders/Crear Pedido y Sales/Registrar Venta.
  Cada ticket admite un solo comentario: para repetir la prueba registra una venta nueva.
