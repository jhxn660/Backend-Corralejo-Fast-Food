info:
  name: Cambiar Estado Comentario ID
  type: http
  seq: 6

http:
  method: PATCH
  url: "http://localhost:3000/api/comments/{{commentId}}/status"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{commentId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // false lo oculta: sale de Listar Comentarios Publicos y deja de contar en las valoraciones.
      // true lo vuelve a mostrar. Esperado 200. "status" que no sea booleano → 400.
      { "status": false }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
