info:
  name: Panel Indicadores
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/api/indicators/panel?month=2026-11&compareA=2026-11&compareB=2026-10&yearA=2026&yearB=2025
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Pantalla de Indicadores del Frontend ya calculada. Todos los parámetros son opcionales
  (por defecto: mes actual vs anterior, año del mes vs el anterior).
  PRUEBA: Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta). Registra antes alguna venta (Sales/Registrar Venta). Esperado 200. Con otro rol → 403; sin token o vencido → 401.
