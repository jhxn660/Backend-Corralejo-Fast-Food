info:
  name: Crear Productos
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/products
  body:
    type: json
    data: |-
      {
        "nombre": "Hamburguesa CFF",
        "description": "Hamburguesa con carne de res o de cerdo, pan, lechuga, tomate",
        "price": 35000,
        "stock": 54,
        "state": "disponible",
        "createdBy": "Karen Matin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
