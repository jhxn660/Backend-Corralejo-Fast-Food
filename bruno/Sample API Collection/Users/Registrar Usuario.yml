info:
  name: Registrar Usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/users
  headers:
    - name: X-Token
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2YWYzNTFjOGRkNDg2YWQ5ZTI1OWJjMGEiLCJuYW1lIjoiSnVhblMiLCJlbWFpbCI6IjQ1NTQ3MzgzdzNAZ21haWwuY29tIiwicm9sZSI6IkNsaWVudGUiLCJzdGF0ZSI6dHJ1ZSwiaWF0IjoxNzk1MTk3NjY5LCJleHAiOjE3OTUyMDEyNjl9.RJ0ZlXnVSmPc6n1rgTYM2iblNy3db7WXarCCI_LWyOQ
  body:
    type: json
    data: |-
      // PRUEBA: Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // "role" del modelo User. Solo un Owner puede crear otro Owner (Administrador → 403).
      // createdBy lo asigna el servidor. $timestamp evita correos duplicados al repetir.
      // Esperado 201 sin password; guarda {{userId}}. Con otro rol → 403; sin token o vencido → 401.
      {
        "role": "Administrador",
        "name": "Tom Gomez",
        "email": "tom{{$timestamp}}@correo.com",
        "password": "Tom@12345",
        "empleado_rol": "Cajero"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("userId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
