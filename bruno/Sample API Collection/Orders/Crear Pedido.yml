info:
  name: Crear Pedido
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/orders
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{productId}} (Products/Crear Producto). Token: Owner, Administrador o Empleado.
      // Solo se envía productId y quantity: nombre y precio salen del catálogo y se copian en la línea.
      // Esperado 201: orderNumber consecutivo (1, 2, 3…), precio_unitario = precio actual del producto,
      // subtotal = quantity × precio, totalPedido = suma, estado "En preparación". Guarda {{orderId}}.
      // Si envías precio_unitario, subtotal, totalPedido u orderNumber se ignoran. El mismo productId
      // repetido se une en una sola línea.
      // Errores 400: "items": [], quantity 0 o decimal, productId mal formado, producto inexistente u oculto.
      {
        "items": [
          { "productId": "{{productId}}", "quantity": 2 }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("orderId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
