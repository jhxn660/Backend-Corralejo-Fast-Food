info:
  name: Listar Pedidos
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:3000/api/orders"
  headers:
    - name: X-Token
      value: "{{token}}"

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Filtro opcional ?estado=En preparación|Listo|Entregado|Finalizado|Cancelado. Esperado 200, del más reciente al más antiguo.
