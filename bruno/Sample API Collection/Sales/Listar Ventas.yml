info:
  name: Listar Ventas
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/sales
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Rango opcional ?from=YYYY-MM-DD&to=YYYY-MM-DD (ambos incluidos). Cada venta trae su pedido en orderId. Otro formato → 400.
