info:
  name: Leer Todos Productos
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/api/products
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Filtro opcional ?isActive=true|false|all (por defecto all). Esperado 200.
