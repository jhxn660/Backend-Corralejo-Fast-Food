info:
  name: Eliminar Usuario ID
  type: http
  seq: 6

http:
  method: DELETE
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
