info:
  name: Verificar/Actualizar Authentication
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/auth/renew-token
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Reemplaza el token por el renovado
        if (res.status === 200) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
