info:
  name: Registrar Informacion
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/informacion
  body:
    type: json
    data: |-
      {
          "titulo": "La Historia de Corralejo",
          "subtitulo": "Desde 2018",
          "contenido": "Corralejo Fast Food nació como un proyecto familiar apasionado por los sabores auténticos y la comida rápida de calidad.",
          "categoria": "El Origen"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
