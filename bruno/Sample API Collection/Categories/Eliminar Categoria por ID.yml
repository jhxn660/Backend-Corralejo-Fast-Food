info:
  name: Eliminar Categoria por ID
  type: http
  seq: 5

http:
  method: DELETE
  url: "http://localhost:3000/api/categories/{{categoryId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{categoryId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200 con la categoría eliminada; repetir → 404.
  Ojo: sus productos e insumos quedan apuntando a una categoría que ya no existe.
