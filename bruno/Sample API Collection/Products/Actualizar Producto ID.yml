info:
  name: Actualizar Producto ID
  type: http
  seq: 5

http:
  method: PATCH
  url: "http://localhost:3000/api/products/{{productId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "nombre": "Hamburguesa CFF {{$timestamp}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
