info:
  name: Eliminar Producto ID
  type: http
  seq: 6

http:
  method: DELETE
  url: "http://localhost:3000/api/products/{{productId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{productId}}. Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200; repetir → 404. Para solo ocultarlo usa Cambiar Estado.
