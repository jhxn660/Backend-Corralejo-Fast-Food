info:
  name: Crear Insumo
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/supplies
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Pan brioche {{$timestamp}}",
        "description": "Pan artesanal para hamburguesa",
        "medida": "Unidades",
        "cost": 1200,
        "stock": 300,
        "category": "{{categoryId}}"
      }
      // "createdBy" ya no se envia: se extrae el id del usuario en el middleware
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Guarda el _id creado para las peticiones por ID que siguen
        if (res.status === 201) {
          bru.setVar("supplyId", res.body.data._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  CAMBIO: las categorias solo se gestionan en la carpeta Categories. Antes de esta peticion ejecuta
  Categories > Crear Categoria con "type": "Insumo" (el modelo valida el tipo); guarda su _id en {{categoryId}}.
