info:
  name: Dashboard Completo
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/indicators/dashboard
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Formato del dashboard anterior (kpis, goal, comparison, productRows, ranking, reviews).
  Para la vista actual usa Panel Indicadores. Opcional ?date=YYYY-MM-DD.
  PRUEBA: Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta). Esperado 200. Con otro rol → 403; sin token o vencido → 401.
