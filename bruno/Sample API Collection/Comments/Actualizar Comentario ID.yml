info:
  name: Actualizar Comentario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/comments/{{commentId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "comentario": "Excelente, la comida llegó súper rápida y muy deliciosa."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
