info:
  name: Listar Mis PQRS
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:3000/api/pqrs/mine
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: solo el rol Cliente (Login con la cuenta de Registro Público Cliente).
  Esperado 200 con SOLO las PQRS de esa cuenta, de la más reciente a la más antigua, con
  "respuesta" y "respondedAt" cuando la administración ya respondió (sin "respondedBy").
  Sin token → 401; Owner, Administrador o Empleado → 403 (ellos usan Listar Todas PQRS).
