info:
  name: Eliminar Receta ID
  type: http
  seq: 5

http:
  method: DELETE
  url: "http://localhost:3000/api/recipes/{{recipeId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{recipeId}}. Token: Owner o Administrador (Empleado → 403).
  Esperado 200: el producto deja de gastar insumos al venderse. Repetir → 404.
