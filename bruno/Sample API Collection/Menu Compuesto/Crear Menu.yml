  url: http://localhost:3000/api/menu
  body:
    type: json
    data: |-
      {
        "nombreCategoria": "Hamburguesa",
        "descripcion": "Indaga sobre la nueva categoria de hamburguesa y admira los diferentes sabores",
        "price": 25000,
        "combo": "Papas, yuca, bebida",
