info:
  name: Listar Cierre ID
  type: http
  seq: 3

http:
  method: GET
  url: "http://localhost:3000/api/cierres/{{cierreId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{cierreId}}. Pública, no requiere token.
  Esperado 200. ID inexistente → 404; ID mal formado → 400.
