info:
  name: Obtener Usuario Por ID
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:3000/api/users/{{userId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{userId}}. Token: Owner o Administrador, o el propio usuario.
  Esperado 200 sin password. ID inexistente → 404; ID mal formado → 400.
