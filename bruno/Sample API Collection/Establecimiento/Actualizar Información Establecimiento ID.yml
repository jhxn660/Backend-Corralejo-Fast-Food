info:
  name: Actualizar Información Establecimiento ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/establecimiento/{{establecimientoId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
          "subtitulo": "Desde 2018 en Bogotá",
          "contenido": "Corralejo Fast Food nació como un proyecto familiar y hoy comparte sus sabores auténticos en varias sedes."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
