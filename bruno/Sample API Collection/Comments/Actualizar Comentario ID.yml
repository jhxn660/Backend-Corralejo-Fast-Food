info:
  name: Actualizar Comentario ID
  type: http
  seq: 4

http:
  method: PATCH
  url: "http://localhost:3000/api/comments/{{commentId}}"
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      // PRUEBA: requiere {{commentId}} (Registrar Comentario). Token: Owner o Administrador (ejecuta Authentication/Login Usuario con esa cuenta).
      // Cambia "comentario" o "calificacion". codigo, venta, usuario e status se ignoran
      // (la visibilidad se cambia en Cambiar Estado Comentario ID).
      // Esperado 200. "calificacion": 9 → 400. ID inexistente → 404; ID mal formado → 400.
      {
        "comentario": "Excelente, la comida llegó súper rápida y muy deliciosa."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
