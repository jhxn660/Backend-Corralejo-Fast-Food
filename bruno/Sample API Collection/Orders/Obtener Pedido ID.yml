info:
  name: Obtener Pedido ID
  type: http
  seq: 3

http:
  method: GET
  url: "http://localhost:3000/api/orders/{{orderId}}"
  headers:
    - name: X-Token
      value: "{{token}}"

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  PRUEBA: requiere {{orderId}}. Token: Owner, Administrador o Empleado (ejecuta Authentication/Login Usuario con esa cuenta).
  Esperado 200 con orderNumber, detalles y totalPedido. ID inexistente → 404; ID mal formado → 400.
